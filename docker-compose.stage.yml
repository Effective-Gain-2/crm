
services:
  backend:
    build: ./
    restart: always
    expose:
      - "3002"
      - "3333"

  frontend:
    build: ./client/whatsapp-web-js-client
    args:
      - REACT_APP_URL=https://backend-stage.effectivegain.com
      - REACT_APP_WS_URL=http://backend:3333
    restart: always
    expose:
      - "80"