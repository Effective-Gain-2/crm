services:
  backend:
    build: ./
    restart: always
    expose:
      - "3002"
      - "3333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client/whatsapp-web-js-client
      args:
        REACT_APP_URL: /
        REACT_APP_RECAPTCHA_SITE_KEY: 6LfPUUgsAAAAAF1UNb5tVs6bDjbcMwQMEYR-eUHw
        REACT_APP_SOCKET_URL: eg-crm.effectivegain.com
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
